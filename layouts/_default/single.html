{{ define "main" }}
  <section{{ if eq .Section "blog" }} class="blog-post"{{ end }}>
    <h1 class="post">{{ .Title }}</h1>
    {{ .Content }}
    {{ if eq .Section "blog" }}
      <div class="post-date">
        <time class="time" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
        {{ range .GetTerms "tags" }}
          <span aria-hidden="true"> · </span><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        {{ end }}
      </div>
    {{ end }}
  </section>
{{ end }}
