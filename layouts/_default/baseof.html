<!doctype html>
<html data-theme="dark" lang="{{ .Site.LanguageCode | default "en" }}">
  {{ partial "head.html" . }}
  <body>
    <a class="skip-link" href="#main">Skip to main</a>
    <div class="content">
      {{ partial "header.html" . }}
      <main id="main" tabindex="-1">
        {{ block "main" . }}{{ end }}
      </main>
    </div>
    {{ partial "footer.html" . }}
  </body>
</html>
