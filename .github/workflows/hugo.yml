name: Deploy Hugo to Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: "0.148.2"
          extended: true
      - run: hugo --environment production --minify --cleanDestinationDir
      - name: Check stylesheet and script loading
        run: python3 tools/check_asset_loading.py
      - name: Check publication files
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess

          internal_names = {"agents.md", "agents.override.md", "claude.md", "gemini.md", "notes.txt"}
          internal_dirs = {"local", "archive", ".agents", ".codex", ".claude", ".cursor", ".git"}
          tracked = [Path(p) for p in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0") if p]
          published = [p for p in Path("public").rglob("*") if p.is_file()]
          blocked = []
          for path in tracked + published:
              name = path.name.casefold()
              if (name in internal_names or internal_dirs.intersection(part.casefold() for part in path.parts)
                      or name == ".env" or (name.startswith(".env.") and name != ".env.example")
                      or path.suffix.casefold() in {".pem", ".key", ".log", ".tmp"}):
                  blocked.append(str(path))
          if blocked:
              raise SystemExit("Internal files must stay local:\n" + "\n".join(blocked))
          print(f"Checked {len(tracked)} tracked files and {len(published)} published files.")
          PYCODE
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
