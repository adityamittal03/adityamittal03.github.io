baseURL = 'https://adityamittal03.github.io'
languageCode = 'en-us'
title = 'Aditya Mittal'
theme = 'maverick'
ignoreFiles = ['(^|/)\\.DS_Store$']

[build]
  publishDir = 'public'

# Google Analytics Configuration
# googleAnalytics = 'G-HBBB14MJL3'  

[permalinks]
  pages = "/:slug"

[params]
  logo = '/site-icon.jpg'
  description = "Aditya Mittal researches robot learning and dexterous manipulation at UC Irvine."
  author = 'Aditya Mittal'
  items = 10

[menu]
  [[menu.main]]
    identifier = "papers"
    name = "Papers"
    url = "/#papers"
    weight = 1
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 4

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'monokailight'
    tabWidth = 4
